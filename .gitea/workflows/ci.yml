name: ci
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: 'TZ=Europe/Bucharest 0 22 * * *'

jobs:
  test:
    runs-on: mdt-ci
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: ruff check .
      - name: Tests (unit, integration, golden)
        run: python3 -m test.pymdtest

  build:
    runs-on: mdt-ci
    steps:
      - uses: actions/checkout@v4
      - name: Build the three reference parts
        run: |
          for mcu in atmega328p f030f4 f103c8; do
            make MCU=$mcu
          done
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/*/*.elf
            build/*/*.hex
            build/*/*.bin
            build/*/build_info.yaml

  hardware-atmega328p:
    needs: build
    runs-on: mdt-ci
    steps:
      - uses: actions/checkout@v4
      - name: Build and flash
        run: make MCU=atmega328p PORT=/dev/ttyACM0 flash
      - name: Hardware tests on the real board
        run: MCU=atmega328p MDT_PORT=/dev/ttyACM0 python3 -m test.pymdtest hardware

  hardware-f030f4:
    needs: build
    runs-on: mdt-ci
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make MCU=f030f4 PORT=/dev/ttyUSB0
      # shortcut: st-flash called directly because the repo's flash command has no --serial;
      # move the serial into build_system/stm32 YAML if you ever flash multiple boards locally
      - name: Flash via its own ST-Link
        run: st-flash --serial 460064000B0000353339594E --reset write build/f030f4/mcu_mdt_example.bin 0x08000000
      - name: Hardware tests on the real board
        run: MCU=f030f4 MDT_PORT=/dev/ttyUSB0 python3 -m test.pymdtest hardware

  hardware-f103c8:
    needs: build
    runs-on: mdt-ci
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make MCU=f103c8 PORT=/dev/ttyUSB1
      - name: Flash via its own ST-Link
        run: st-flash --serial 43006200070000325151524E --reset write build/f103c8/mcu_mdt_example.bin 0x08000000
      - name: Hardware tests on the real board
        run: MCU=f103c8 MDT_PORT=/dev/ttyUSB1 python3 -m test.pymdtest hardware