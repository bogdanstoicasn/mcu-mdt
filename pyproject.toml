[build-system]
requires = ["setuptools>=62.3"]   # 62.3: "**" in package-data
build-backend = "setuptools.build_meta"

[project]
name = "mcu-mdt"
version = "1.0.0"
description = "Debugger for embedded microcontrollers"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mihai-Bogdan Stoica" }]
license = { text = "MIT" }
dependencies = [
    "pyserial",
    "pyyaml",
    "pyelftools",
    "pyreadline3; sys_platform == 'win32'",
]

[project.scripts]
mcu-mdt = "pc_tool.main:main"

[project.optional-dependencies]

dev = ["ruff"]

[tool.setuptools.packages.find]
include = ["pc_tool*"]

# The tool reads these at run time; without them an installed mcu-mdt has no commands and no parts.
[tool.setuptools.package-data]
pc_tool = ["configs/*.yaml", "mcu_db/**/*.atdf", "mcu_db/**/*.svd"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
exclude = ["build/", "dist/", ".venv/"]

[tool.ruff.lint.isort]
known-first-party = ["pc_tool"]

[tool.ruff.format]
quote-style = "double"